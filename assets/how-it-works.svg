<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" role="img" aria-labelledby="t d">
  <title id="t">How every recipe works</title>
  <desc id="d">Four steps: your data becomes the state; you ask Choice, Noul and Score questions; Jev returns typed answers with probabilities in about 0.4 seconds; your code decides to act, review or hold.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .jev { fill: #ecfdf9; stroke: #14b8a6; }
    .h { fill: #1f2328; }
    .p { fill: #57606a; }
    .code { fill: #ffffff; stroke: #d0d7de; }
    .codet { fill: #0f766e; }
    .num { fill: #1f2328; }
    .numt { fill: #ffffff; }
    .arrow { stroke: #8c959f; fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .jev { fill: #0f2a2a; stroke: #14b8a6; }
      .h { fill: #e6edf3; }
      .p { fill: #9da7b3; }
      .code { fill: #0d1117; stroke: #30363d; }
      .codet { fill: #5eead4; }
      .num { fill: #e6edf3; }
      .numt { fill: #0d1117; }
      .arrow { stroke: #6e7681; fill: #6e7681; }
    }
  </style>

  <g class="sans">
    <!-- 1 -->
    <rect x="30" y="24" width="268" height="200" rx="14" class="box"/>
    <circle cx="62" cy="58" r="15" class="num"/><text x="62" y="63.5" text-anchor="middle" font-size="15" font-weight="700" class="numt">1</text>
    <text x="88" y="64" font-size="19" font-weight="700" class="h">Your data</text>
    <text x="50" y="104" font-size="14.5" class="p">The state: a ticket, a row,</text>
    <text x="50" y="125" font-size="14.5" class="p">an email, a web page. Only</text>
    <text x="50" y="146" font-size="14.5" class="p">the fields a person would need.</text>
    <rect x="50" y="170" width="228" height="34" rx="8" class="code"/>
    <text x="62" y="192" class="mono codet" font-size="13.5">{ "message": "…" }</text>

    <!-- 2 -->
    <rect x="342" y="24" width="268" height="200" rx="14" class="box"/>
    <circle cx="374" cy="58" r="15" class="num"/><text x="374" y="63.5" text-anchor="middle" font-size="15" font-weight="700" class="numt">2</text>
    <text x="400" y="64" font-size="19" font-weight="700" class="h">Your questions</text>
    <text x="362" y="104" font-size="14.5" class="p">Choice, Noul or Score, all in</text>
    <text x="362" y="125" font-size="14.5" class="p">one call. Describe every option</text>
    <text x="362" y="146" font-size="14.5" class="p">and what doesn't count.</text>
    <rect x="362" y="170" width="228" height="34" rx="8" class="code"/>
    <text x="374" y="192" class="mono codet" font-size="13.5">refund: noul("asks for…")</text>

    <!-- 3 -->
    <rect x="654" y="24" width="268" height="200" rx="14" class="jev"/>
    <circle cx="686" cy="58" r="15" fill="#14b8a6"/><text x="686" y="63.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
    <text x="712" y="64" font-size="19" font-weight="700" class="h">Jev answers</text>
    <text x="674" y="104" font-size="14.5" class="p">Typed answers, a probability</text>
    <text x="674" y="125" font-size="14.5" class="p">for every option, and a</text>
    <text x="674" y="146" font-size="14.5" class="p">confidence, in about 0.4 s.</text>
    <rect x="674" y="170" width="228" height="34" rx="8" class="code"/>
    <text x="686" y="192" class="mono codet" font-size="13.5">billing 1.00 · refund 0.99</text>

    <!-- 4 -->
    <rect x="966" y="24" width="284" height="200" rx="14" class="box"/>
    <circle cx="998" cy="58" r="15" class="num"/><text x="998" y="63.5" text-anchor="middle" font-size="15" font-weight="700" class="numt">4</text>
    <text x="1024" y="64" font-size="19" font-weight="700" class="h">Your code decides</text>
    <text x="986" y="104" font-size="14.5" class="p">Thresholds, weights and actions</text>
    <text x="986" y="125" font-size="14.5" class="p">live in code: act when sure,</text>
    <text x="986" y="146" font-size="14.5" class="p">send the middle to a person.</text>
    <rect x="986" y="170" width="244" height="34" rx="8" class="code"/>
    <text x="998" y="192" class="mono codet" font-size="13.5">conf ≥ 0.8 ? queue : review</text>
  </g>

  <g class="arrow" stroke-width="2.5">
    <line x1="304" y1="124" x2="328" y2="124"/><path d="M336 124 l-10 -6 v12 z" stroke="none"/>
    <line x1="616" y1="124" x2="640" y2="124"/><path d="M648 124 l-10 -6 v12 z" stroke="none"/>
    <line x1="928" y1="124" x2="952" y2="124"/><path d="M960 124 l-10 -6 v12 z" stroke="none"/>
  </g>
</svg>
